name: CI

on:
  push:
    branches: [Dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -encoders | grep opus
          pip install -U yt-dlp --break-system-packages || pip3 install -U yt-dlp --break-system-packages

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DISCORD_TOKEN: ci-dummy-token
          DISCORD_CLIENT_ID: "0"
          DISCORD_CLIENT_SECRET: ci-dummy-secret
          BETTER_AUTH_SECRET: ci-dummy-secret-32-chars-long-ok
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
