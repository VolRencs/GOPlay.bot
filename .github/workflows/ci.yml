name: CI

on:
  push:
    branches: [Dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ci-dummy-token
      DISCORD_CLIENT_ID: "0"
      DISCORD_CLIENT_SECRET: ci-dummy-secret
      BETTER_AUTH_SECRET: ci-dummy-secret-32-chars-long-ok
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_PATH: ${{ runner.temp }}/ci-build.sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Warmup build DB (serial)
        run: |
          if [ ! -f .env ]; then touch .env; fi
          pnpm migrate:auth
          sqlite3 "$DATABASE_PATH" "PRAGMA wal_checkpoint(TRUNCATE);" || true

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
