name: CI

on:
  push:
    branches: [Dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ci-dummy-token
      DISCORD_CLIENT_ID: "0"
      DISCORD_CLIENT_SECRET: ci-dummy-secret
      BETTER_AUTH_SECRET: ci-dummy-secret-32-chars-long-ok
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Configure temporary database path
        run: echo "DATABASE_PATH=$RUNNER_TEMP/ci-build.sqlite" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Warmup build DB (serial)
        run: |
          pnpm migrate:auth
          node -e "const { DatabaseSync } = require('node:sqlite'); new DatabaseSync(process.env.DATABASE_PATH).exec('PRAGMA wal_checkpoint(TRUNCATE)')" || true

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
